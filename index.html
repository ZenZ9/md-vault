<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MD Vault</title>
  <meta name="theme-color" content="#161719">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-head">
        <button id="open-btn" class="btn primary" type="button">Open folder</button>
      </div>

      <div class="action-bar">
        <button id="new-btn" class="btn small" type="button" title="New note in the target folder" disabled>+ Note</button>
        <button id="new-folder-btn" class="btn small" type="button" title="New folder in the target folder" disabled>+ Folder</button>
      </div>
      <div id="target-label" class="target-label" title="New files and folders go here. Click a folder in the tree to change it, or click here to go back to the vault root.">Target: /</div>

      <div id="reopen-bar" class="reopen-bar" hidden>
        <span>Last vault:</span>
        <button id="reopen-btn" class="link" type="button"></button>
      </div>

      <div class="search-bar">
        <input id="search" class="search" type="search" placeholder="Search files…" autocomplete="off" spellcheck="false">
      </div>

      <nav id="tree" class="tree-wrap" aria-label="File tree"></nav>
      <div class="sidebar-foot"><span id="vault-name">no folder</span></div>
    </aside>

    <div id="scrim" class="scrim" hidden></div>

    <main class="main">
      <div class="toolbar">
        <button id="menu-btn" class="btn icon menu-btn" type="button" aria-label="Toggle file list">☰</button>
        <span id="file-path" class="path">No file selected</span>
        <span id="status" class="status"></span>
        <button id="toggle-preview" class="btn" type="button">Preview</button>
      </div>
      <div id="panes" class="panes">
        <textarea id="editor" class="editor" spellcheck="false" placeholder="Open a note from the sidebar…" disabled></textarea>
        <div id="preview" class="preview"></div>
      </div>
      <button id="markdown-tools-btn" class="markdown-tools-toggle" type="button" aria-label="Open Markdown toolbar" aria-expanded="false" disabled>✎</button>
      <div id="markdown-tools-scrim" class="markdown-tools-scrim" hidden></div>
      <aside id="markdown-tools" class="markdown-tools" aria-label="Markdown toolbar" aria-hidden="true">
        <div class="markdown-tools-head">
          <strong>Markdown</strong>
          <button id="markdown-tools-close" class="btn icon" type="button" aria-label="Close Markdown toolbar">×</button>
        </div>
        <div class="markdown-tools-grid">
          <button type="button" data-md-action="bold" title="Bold"><strong>B</strong></button>
          <button type="button" data-md-action="italic" title="Italic"><em>I</em></button>
          <button type="button" data-md-action="strike" title="Strikethrough"><s>S</s></button>
          <button type="button" data-md-action="code" title="Inline code"><code>&lt;/&gt;</code></button>
          <button type="button" data-md-action="h1" title="Heading 1">H1</button>
          <button type="button" data-md-action="h2" title="Heading 2">H2</button>
          <button type="button" data-md-action="h3" title="Heading 3">H3</button>
          <button type="button" data-md-action="bullet" title="Bullet list">• List</button>
          <button type="button" data-md-action="number" title="Numbered list">1. List</button>
          <button type="button" data-md-action="task" title="Task list">☐ Task</button>
          <button type="button" data-md-action="quote" title="Blockquote">Quote</button>
          <button type="button" data-md-action="codeblock" title="Code block">Code block</button>
          <button type="button" data-md-action="link" title="Link">Link</button>
          <button type="button" data-md-action="image" title="Image">Image</button>
          <button type="button" data-md-action="table" title="Table">Table</button>
          <button type="button" data-md-action="hr" title="Horizontal rule">— HR</button>
        </div>
      </aside>
      <div id="completions" class="completions" hidden></div>
    </main>
  </div>

  <input type="file" id="fallback-input" webkitdirectory multiple hidden>

  <script src="markdown.js"></script>
  <script src="app.js"></script>
</body>
</html>
